<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="presentation" focusable="false" aria-hidden="true">
  <rect width="400" height="400" fill="#dddfe4"/>
  <rect x="20" y="20" width="360" height="360" rx="8" fill="#d2d5dc"/>

  <!-- Sprue frame -->
  <g fill="none" stroke="#656b74" stroke-width="12" stroke-linejoin="round">
    <rect x="48" y="48" width="304" height="304" rx="6"/>
    <path d="M48 200h304M200 48v304"/>
  </g>

  <!-- Unassembled parts attached by gates -->
  <g fill="#535b64" stroke="#818891" stroke-width="3">
    <!-- Torso halves -->
    <path d="M82 92h50l8 40-10 40H84l-10-40z"/>
    <path d="M258 92h50l10 40-10 40h-46l-8-40z"/>
    <!-- Leg pieces -->
    <path d="M88 236h30l16 90H92z"/>
    <path d="M156 236h30l-14 90h-32z"/>
    <!-- Weapon arm -->
    <rect x="248" y="240" width="86" height="30" rx="8"/>
    <rect x="248" y="286" width="60" height="26" rx="8"/>
    <!-- Head and crest -->
    <circle cx="200" cy="120" r="18"/>
    <path d="M200 156l14 26h-28z"/>
  </g>

  <!-- Injection gates -->
  <g stroke="#656b74" stroke-width="6">
    <path d="M60 112h20M340 112h-24M60 268h28M340 254h-6M200 60v22M200 336v-16"/>
  </g>

  <!-- Part number pips, purely geometric -->
  <g fill="#396bb7">
    <circle cx="140" cy="76" r="5"/>
    <circle cx="268" cy="76" r="5"/>
    <circle cx="120" cy="220" r="5"/>
    <circle cx="268" cy="224" r="5"/>
  </g>
</svg>
