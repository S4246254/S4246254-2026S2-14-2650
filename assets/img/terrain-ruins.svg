<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="presentation" focusable="false" aria-hidden="true">
  <rect width="400" height="400" fill="#dddfe4"/>
  <circle cx="200" cy="200" r="150" fill="#d0d3d8"/>

  <!-- Broken chapel wall -->
  <g fill="#b6bcc5" stroke="#8a93a2" stroke-width="4" stroke-linejoin="round">
    <path d="M96 320V128h80v40h-24v152z"/>
    <path d="M224 320V168h-24v-40h80v192z"/>
    <path d="M152 320v-60h96v60z"/>
  </g>

  <!-- Gothic arch window, blown out at the top -->
  <path d="M172 244v-52a28 28 0 0 1 56 0v52z" fill="#ebedf1"/>
  <path d="M172 200a28 28 0 0 1 56 0" fill="none" stroke="#8a93a2" stroke-width="4"/>
  <path d="M200 164v80" stroke="#8a93a2" stroke-width="4"/>

  <!-- Crumbled masonry along the top edge -->
  <g fill="#b6bcc5" stroke="#8a93a2" stroke-width="3">
    <rect x="104" y="116" width="22" height="16" rx="3"/>
    <rect x="140" y="110" width="18" height="22" rx="3"/>
    <rect x="252" y="112" width="20" height="20" rx="3"/>
  </g>

  <!-- Rubble scattered at the base -->
  <g fill="#c5cad2" stroke="#a0a7b3" stroke-width="3">
    <rect x="60" y="298" width="34" height="22" rx="4" transform="rotate(-8 77 309)"/>
    <rect x="300" y="292" width="40" height="26" rx="4" transform="rotate(11 320 305)"/>
    <rect x="256" y="306" width="26" height="16" rx="3"/>
  </g>

  <!-- Weathered brass trim -->
  <g fill="#396bb7" opacity="0.8">
    <rect x="152" y="256" width="96" height="6" rx="3"/>
    <circle cx="200" cy="136" r="10"/>
  </g>

  <!-- Ground -->
  <ellipse cx="200" cy="330" rx="150" ry="22" fill="#e5e7eb"/>
  <ellipse cx="200" cy="326" rx="150" ry="22" fill="#d5d8de" stroke="#b8bdc4" stroke-width="3"/>
</svg>
